[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treeforge"
version = "0.1.0"
description = "Experimental conjecture discovery and falsification infrastructure for finite trees"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "John Fairfax-Ball"}]
dependencies = [
  "networkx>=3.2,<4",
]

[project.optional-dependencies]
conjecturing = [
  "txgraffiti==0.4.1",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
