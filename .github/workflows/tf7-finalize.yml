name: TF7 Registry Materialization

permissions:
  contents: write

on:
  push:
    branches:
      - tf7-support-mis-diagnosis

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tf7-support-mis-diagnosis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TreeForge
        run: python -m pip install -e .
      - name: Append TF7 candidate revisions
        run: python -m experiments.tf7_finalize
      - name: Commit registry revision
        run: |
          if git diff --quiet -- data/registry/candidates.jsonl; then
            echo "Registry already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry/candidates.jsonl
          git commit -m "TF7: append candidate lifecycle revisions"
          git push origin HEAD:tf7-support-mis-diagnosis
