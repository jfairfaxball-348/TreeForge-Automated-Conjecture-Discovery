name: TF4 materialization

permissions:
  contents: write
  actions: read

on:
  push:
    branches:
      - tf4-scientific-execution

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,conjecturing]'
      - name: Materialize TF4
        run: |
          python -m experiments.tf4_finalize \
            --artifact-dir experiments/TF4-0001/scientific_artifact
      - name: Validate materialized repository
        run: |
          python -m pytest -q
          python -m compileall -q src experiments
          ruff check .
      - name: Commit authoritative TF4 record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry/candidates.jsonl data/registry/experiments.jsonl experiments/TF4-0001
          git commit -m "Materialize TF4-0001 scientific results [skip ci]"
          git push origin HEAD:tf4-scientific-execution
