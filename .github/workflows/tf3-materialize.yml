name: TF3 Materialize Results

permissions:
  contents: write
  actions: read

on:
  push:
    branches:
      - tf3-results
    paths:
      - experiments/tf3_finalize.py
      - .github/workflows/tf3-materialize.yml

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,conjecturing]'
      - name: Download authoritative TF3 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/tf3-0001
          gh run download 36914647703 \
            --repo "${{ github.repository }}" \
            --name tf3-0001-scientific \
            --dir /tmp/tf3-0001
          test -s /tmp/tf3-0001/manifest.json
      - name: Materialize append-only TF3 record
        run: python -m experiments.tf3_finalize --artifact-dir /tmp/tf3-0001
      - name: Validate materialized tree
        run: |
          python -m pytest -q
          python -m compileall -q src experiments
          ruff check .
      - name: Commit materialized scientific record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/TF3-0001 data/registry/candidates.jsonl data/registry/experiments.jsonl
          git diff --cached --quiet && { echo "No materialized changes"; exit 1; }
          git commit -m "Materialize TF3-0001 scientific record"
          git push
