name: TF4 interpretation probe

permissions:
  contents: read
  actions: read

on:
  push:
    branches:
      - tf4-scientific-execution

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,conjecturing]'
      - name: Static preflight
        run: |
          python -m compileall -q src experiments
          ruff check .
      - name: Run exposed-data interpretation probe
        run: |
          python -m experiments.tf4_interpretation_probe --output /tmp/tf4-interpretation-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: tf4-interpretation-probe
          path: /tmp/tf4-interpretation-probe.json
