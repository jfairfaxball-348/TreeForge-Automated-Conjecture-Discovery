name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,conjecturing]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src experiments
      - name: Static checks
        run: ruff check .
      - name: Deterministic calibration smoke test
        run: |
          python experiments/calibration.py \
            --output-dir /tmp/treeforge-calibration \
            --source-commit "$(git rev-parse HEAD)" \
            --timestamp 2026-10-01T00:00:00Z
          test -s /tmp/treeforge-calibration/registry/candidates.jsonl
          test -s /tmp/treeforge-calibration/registry/experiments.jsonl
      - name: TF2 zero-yield diagnosis
        run: |
          python experiments/tf2_diagnostic.py --output /tmp/tf2-diagnostic.json
          test -s /tmp/tf2-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: tf2-diagnostic
          path: /tmp/tf2-diagnostic.json
      - name: TF2-0001 scientific run
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'tf2-scientific-run-2'
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "$SOURCE_COMMIT" = "${{ github.event.pull_request.head.sha }}"
          python experiments/tf2_discovery.py \
            --spec experiments/TF2-0001/spec.json \
            --output-dir /tmp/tf2-0001 \
            --source-commit "$SOURCE_COMMIT"
          test -f /tmp/tf2-0001/raw_txgraffiti_output.json
          test -f /tmp/tf2-0001/stage_counts.json
          test -f /tmp/tf2-0001/candidate_events.jsonl
          test -f /tmp/tf2-0001/final_candidates.json
          test -f /tmp/tf2-0001/manifest.json
      - name: Upload TF2-0001 scientific artifacts
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'tf2-scientific-run-2'
        uses: actions/upload-artifact@v4
        with:
          name: tf2-0001-scientific
          path: /tmp/tf2-0001
