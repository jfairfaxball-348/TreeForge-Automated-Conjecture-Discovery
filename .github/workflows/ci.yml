name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,conjecturing]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src experiments
      - name: Static checks
        run: ruff check .
      - name: Deterministic calibration smoke test
        run: |
          python experiments/calibration.py             --output-dir /tmp/treeforge-calibration             --source-commit "$GITHUB_SHA"             --timestamp 2026-10-01T00:00:00Z
          test -s /tmp/treeforge-calibration/registry/candidates.jsonl
          test -s /tmp/treeforge-calibration/registry/experiments.jsonl
      - name: TF1 benchmark smoke
        run: python experiments/benchmark_tf1.py --output /tmp/tf1-benchmark.json
      - name: Frozen TF1 controlled discovery
        run: |
          python experiments/tf1_discovery.py             --spec experiments/TF1-0001/spec.json             --output-dir /tmp/tf1             --source-commit "$GITHUB_SHA"
          test -s /tmp/tf1/manifest.json
          test -s /tmp/tf1/raw_txgraffiti_output.json
          test -s /tmp/tf1/observed_candidates.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: tf1-controlled-discovery
          path: |
            /tmp/tf1
            /tmp/tf1-benchmark.json
