name: CI

permissions:
  contents: read
  actions: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,conjecturing]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src experiments
      - name: Static checks
        run: ruff check .
      - name: Deterministic calibration smoke test
        run: |
          python experiments/calibration.py \
            --output-dir /tmp/treeforge-calibration \
            --source-commit "$GITHUB_SHA" \
            --timestamp 2026-10-01T00:00:00Z
          test -s /tmp/treeforge-calibration/registry/candidates.jsonl
          test -s /tmp/treeforge-calibration/registry/experiments.jsonl
      - name: TF2 zero-yield diagnosis
        run: |
          python experiments/tf2_diagnostic.py --output /tmp/tf2-diagnostic.json
          test -s /tmp/tf2-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: tf2-diagnostic
          path: /tmp/tf2-diagnostic.json
      - name: TF4 exposed-data diagnosis
        run: |
          python experiments/tf4_diagnostic.py --output /tmp/tf4-diagnostic.json --skip-order14-timing
          test -s /tmp/tf4-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: tf4-diagnostic
          path: /tmp/tf4-diagnostic.json
      - name: TF6 exposed MIS-coordinate diagnosis
        run: |
          python -m experiments.tf6_mis_diagnosis --output /tmp/tf6-mis-diagnosis.json
          test -s /tmp/tf6-mis-diagnosis.json
      - uses: actions/upload-artifact@v4
        with:
          name: tf6-mis-diagnosis
          path: /tmp/tf6-mis-diagnosis.json
      - name: TF7 support/MIS structural diagnosis
        run: |
          python -m experiments.tf7_support_mis_diagnosis --output /tmp/tf7-support-mis-diagnosis.json
          test -s /tmp/tf7-support-mis-diagnosis.json
      - uses: actions/upload-artifact@v4
        with:
          name: tf7-support-mis-diagnosis
          path: /tmp/tf7-support-mis-diagnosis.json
      - name: TF8 fixed-support equality diagnosis
        run: |
          python -m experiments.tf8_fixed_support_equality --output /tmp/tf8-fixed-support-equality.json
          test -s /tmp/tf8-fixed-support-equality.json
      - uses: actions/upload-artifact@v4
        with:
          name: tf8-fixed-support-equality
          path: /tmp/tf8-fixed-support-equality.json
      - name: TF9 audit integrity check
        run: python -m pytest -q tests/test_tf9_audit.py
      - name: TF10 next-question diagnosis
        run: |
          python -m experiments.tf10_next_question_diagnosis --output /tmp/tf10-next-question-diagnosis.json
          test -s /tmp/tf10-next-question-diagnosis.json
      - uses: actions/upload-artifact@v4
        with:
          name: tf10-next-question-diagnosis
          path: /tmp/tf10-next-question-diagnosis.json
      - name: TF11 research-question audit
        run: |
          python -m experiments.tf11_research_question_audit --output /tmp/tf11-research-question-audit.json
          test -s /tmp/tf11-research-question-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: tf11-research-question-audit
          path: /tmp/tf11-research-question-audit.json

      - name: TF12 segment/domination diagnosis
        run: |
          python -m experiments.tf12_segment_domination_diagnosis --output /tmp/tf12-segment-domination.json
          test -s /tmp/tf12-segment-domination.json
      - uses: actions/upload-artifact@v4
        with:
          name: tf12-segment-domination
          path: /tmp/tf12-segment-domination.json

      - name: TF13 segment/domination equality diagnosis
        run: |
          python -m experiments.tf13_segment_domination_equality --output /tmp/tf13-segment-domination-equality.json
          test -s /tmp/tf13-segment-domination-equality.json
      - uses: actions/upload-artifact@v4
        with:
          name: tf13-segment-domination-equality
          path: /tmp/tf13-segment-domination-equality.json
