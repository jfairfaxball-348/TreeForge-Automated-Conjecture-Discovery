name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,conjecturing]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src experiments
      - name: Static checks
        run: ruff check .
      - name: Deterministic calibration smoke test
        run: |
          python experiments/calibration.py \
            --output-dir /tmp/treeforge-calibration \
            --source-commit "$(git rev-parse HEAD)" \
            --timestamp 2026-10-01T00:00:00Z
          test -s /tmp/treeforge-calibration/registry/candidates.jsonl
          test -s /tmp/treeforge-calibration/registry/experiments.jsonl
      - name: TF2 zero-yield diagnosis
        run: |
          python experiments/tf2_diagnostic.py --output /tmp/tf2-diagnostic.json
          test -s /tmp/tf2-diagnostic.json
      - name: TF2 discovery convex-hull performance probe
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.head_ref == 'tf2-scientific-run'
        run: |
          timeout 600 python - <<'PY'
          import time
          import numpy as np
          import pandas as pd
          from scipy.spatial import ConvexHull, QhullError
          from treeforge.experiments import experiment_corpus_rows, load_frozen_spec

          spec = load_frozen_spec("experiments/TF2-0001/spec.json")
          names = list(spec["corpus_invariants"])
          dmin, dmax = spec["discovery_orders"]
          rows = experiment_corpus_rows(
              dmin,
              dmax,
              names,
              role="discovery",
              source_commit="PERFORMANCE_DIAGNOSTIC",
              experiment_id="TF2-DIAG-PERF",
          )
          cols = [*spec["discovery_features"], spec["target"]]
          frame = pd.DataFrame([{name: row[name] for name in cols} for row in rows])
          points = frame.to_numpy(dtype=float)
          start = time.perf_counter()
          try:
              hull = ConvexHull(points)
              mode = "default"
          except QhullError:
              hull = ConvexHull(points, qhull_options="QJ")
              mode = "QJ"
          elapsed = time.perf_counter() - start
          print({
              "rows": len(rows),
              "dimensions": points.shape[1],
              "qhull_mode": mode,
              "facets": len(hull.equations),
              "seconds": elapsed,
          }, flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tf2-diagnostic
          path: /tmp/tf2-diagnostic.json
      - name: TF2-0001 scientific run
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'tf2-scientific-run'
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "$SOURCE_COMMIT" = "${{ github.event.pull_request.head.sha }}"
          python experiments/tf2_discovery.py \
            --spec experiments/TF2-0001/spec.json \
            --output-dir /tmp/tf2-0001 \
            --source-commit "$SOURCE_COMMIT"
          test -f /tmp/tf2-0001/raw_txgraffiti_output.json
          test -f /tmp/tf2-0001/candidate_events.jsonl
          test -f /tmp/tf2-0001/final_candidates.json
          test -f /tmp/tf2-0001/manifest.json
      - name: Upload TF2-0001 scientific artifacts
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'tf2-scientific-run'
        uses: actions/upload-artifact@v4
        with:
          name: tf2-0001-scientific
          path: /tmp/tf2-0001
